<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <header>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark" style="color:#fff;">
        <div class="container-fluid">
            <a class="navbar-brand">te lo vendo.com</a>
            <ul class="navbar-nav">
            <li class="nav-item"><a href="index.html" class="nav-link active" aria-current="page">Inicio</a></li>
            <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Nosotros</a></li>
            <li class="nav-item"><a href="#" class="nav-link active" aria-current="page">Contacto</a></li>                                  
            </ul>
            <h1 style="font-family: Arial; font-size: 30px;" class="d-flex me-2">Lo quieres, te lo vendo</h1>
        </div>
    </nav>
    </header>

    <main class=""container py-5>
        <div class="card">
        <div class="card-header">
        Contáctanos a nosotros respondimos ligerito
        </div>
    
    <div class="card-body">
        <form name="myForm" action="index.html" onsubmit="return validateForm(),validateEmail(correo)" method="post" required>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre">
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico:</label>
                <input type="text" class="form-control" id="correo" name="correo">
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje:</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
    </div>
    </div> 
    </main>

    <footer class = "footer">
        &copy; Christian Cabrera, Sebastian Saavedra, Cristobal Spinola e Ignacio Ponce.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="funciones.js"></script>

</body>
</html>
